[package]
name = "codex-cli-manager"
version = "0.1.0"
description = "A fast local manager for Codex CLI sessions"
authors = ["flensbursche"]
edition = "2021"

[lib]
name = "codex_cli_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
