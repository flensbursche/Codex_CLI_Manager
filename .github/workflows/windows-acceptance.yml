name: Windows release acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release candidate tag, for example v0.10.0"
        required: true
        type: string
      previous_tag:
        description: "Previous release tag for a destructive upgrade test on the disposable runner"
        required: false
        type: string
      interactive_terminal:
        description: "Open a real Windows Terminal and verify its marker"
        required: true
        default: true
        type: boolean
      require_signature:
        description: "Fail unless the executable has a valid Authenticode signature"
        required: true
        default: false
        type: boolean
      codex_test_label:
        description: "Codex version/state image prepared on this runner"
        required: true
        default: "current"
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64, codex-manager-ui]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          New-Item -ItemType Directory -Path artifacts/current -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --dir artifacts/current --pattern "CodexSessionManager-Setup-win-x64.zip*"
          if ($env:PREVIOUS_TAG) {
            New-Item -ItemType Directory -Path artifacts/previous -Force | Out-Null
            gh release download $env:PREVIOUS_TAG --repo $env:GH_REPO --dir artifacts/previous --pattern "CodexSessionManager-Setup-win-x64.zip*"
          }

      - name: Run packaged Windows acceptance
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          INTERACTIVE_TERMINAL: ${{ inputs.interactive_terminal }}
          REQUIRE_SIGNATURE: ${{ inputs.require_signature }}
          CODEX_TEST_LABEL: ${{ inputs.codex_test_label }}
        run: |
          $arguments = @{
            PackagePath = "artifacts/current/CodexSessionManager-Setup-win-x64.zip"
            ChecksumPath = "artifacts/current/CodexSessionManager-Setup-win-x64.zip.sha256"
            ExpectedVersion = $env:RELEASE_TAG.TrimStart('v', 'V')
            ReportPath = "artifacts/release-acceptance-$env:CODEX_TEST_LABEL.json"
            InteractiveTerminal = [bool]::Parse($env:INTERACTIVE_TERMINAL)
            RequireSignature = [bool]::Parse($env:REQUIRE_SIGNATURE)
          }
          if ($env:PREVIOUS_TAG) {
            $arguments.PreviousPackagePath = "artifacts/previous/CodexSessionManager-Setup-win-x64.zip"
            $arguments.PreviousChecksumPath = "artifacts/previous/CodexSessionManager-Setup-win-x64.zip.sha256"
            $arguments.DisposableMachine = $true
          }
          & ./scripts/test-release.ps1 @arguments

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-acceptance-${{ inputs.codex_test_label }}
          path: artifacts/release-acceptance-*.json
          if-no-files-found: warn
